site:
  name: Automatiza Murcia
  site: 'https://automatizamurcia.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Automatiza Murcia — Chatbots IA y automatizaciones para PYMEs en Murcia
    template: '%s — Automatiza Murcia'
  description: "Chatbots de WhatsApp 24/7, automatizaciones y webs rápidas para clínicas, gestorías y comercios de la Región de Murcia. Entrega en 7-14 días. Precio cerrado. Garantía 30 días."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Automatiza Murcia
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: false

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
